<popup-page [loading]="loading()">
  <popup-header slot="header" [pageTitle]="headerText()" showBackButton [backAction]="cancel">
  </popup-header>

  @if (!loading()) {
    <form [id]="formId" [formGroup]="form" (ngSubmit)="save()">
      <section class="tw-mb-5">
        <bit-card>
          <bit-form-field>
            <bit-label>{{ "name" | i18n }}</bit-label>
            <input bitInput type="text" formControlName="name" appAutofocus />
          </bit-form-field>

          @if (mode() === "view") {
            <bit-form-field>
              <bit-label>{{ "apiKeySecret" | i18n }}</bit-label>
              @if (!revealSecret()) {
                <input
                  readonly
                  bitInput
                  type="password"
                  [formControl]="form.controls.key"
                  class="tw-font-mono"
                  aria-readonly="true"
                />
              } @else {
                <textarea
                  readonly
                  bitInput
                  [formControl]="form.controls.key"
                  class="tw-font-mono"
                  rows="3"
                  aria-readonly="true"
                ></textarea>
              }
              <button
                type="button"
                bitIconButton
                bitSuffix
                bitPasswordInputToggle
                [toggled]="revealSecret()"
                (toggledChange)="toggleReveal()"
              ></button>
              <button
                type="button"
                bitIconButton="bwi-clone"
                bitSuffix
                (click)="copySecret()"
                [label]="'copyApiKey' | i18n"
              ></button>
            </bit-form-field>
          } @else {
            <bit-form-field>
              <bit-label>{{ "apiKeySecret" | i18n }}</bit-label>
              <input
                bitInput
                [type]="revealSecret() ? 'text' : 'password'"
                formControlName="key"
                class="tw-font-mono"
                [appAutofocus]="mode() === 'view'"
              />
              <button
                type="button"
                bitIconButton
                bitSuffix
                bitPasswordInputToggle
                [toggled]="revealSecret()"
                (toggledChange)="toggleReveal()"
              ></button>
            </bit-form-field>
          }

          <bit-form-field>
            <bit-label>{{ "apiKeyUri" | i18n }}</bit-label>
            <input bitInput type="text" formControlName="uri" [readonly]="mode() === 'view'" />
          </bit-form-field>

          <bit-form-field>
            <bit-label>{{ "folder" | i18n }}</bit-label>
            <select
              bitInput
              formControlName="folderId"
              [disabled]="mode() === 'view'"
              aria-describedby="folderHelp"
            >
              <option [ngValue]="null">{{ "noneFolder" | i18n }}</option>
              @for (folder of folders(); track folder.id) {
                <option [ngValue]="folder.id">{{ folder.name }}</option>
              }
            </select>
          </bit-form-field>
        </bit-card>
      </section>

      <section class="tw-mb-5">
        <bit-section-header>
          <h2 bitTypography="h6">{{ "notes" | i18n }}</h2>
        </bit-section-header>
        <bit-card>
          <bit-form-field>
            <textarea
              bitInput
              rows="5"
              formControlName="notes"
              [readonly]="mode() === 'view'"
            ></textarea>
          </bit-form-field>
        </bit-card>
      </section>
    </form>
  }

  <popup-footer slot="footer">
    @if (mode() === "view") {
      <button type="button" bitButton buttonType="primary" (click)="edit()">
        {{ "edit" | i18n }}
      </button>
      <ng-container slot="end">
        <button
          type="button"
          bitIconButton="bwi-clone"
          [label]="'copyApiKey' | i18n"
          (click)="copySecret()"
        ></button>
        <button
          type="button"
          bitIconButton="bwi-trash"
          buttonType="dangerGhost"
          [label]="'delete' | i18n"
          (click)="delete()"
        ></button>
      </ng-container>
    } @else {
      <button
        type="submit"
        form="apiKeyEditorForm"
        bitButton
        buttonType="primary"
        [disabled]="saving()"
      >
        {{ "save" | i18n }}
      </button>
      <button type="button" bitButton buttonType="secondary" (click)="cancel()" slot="end">
        {{ "cancel" | i18n }}
      </button>
    }
  </popup-footer>
</popup-page>
